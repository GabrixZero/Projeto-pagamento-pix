# ===============================
# PROFILES
# ===============================
spring.profiles.active=local

# ===============================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/transacoes_pix?serverTimezone=UTC

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Driver JDBC do MySQL 8.0
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ===============================
# Exibe no console as consultas SQL que o Spring faz (ótimo para debugar)
spring.jpa.show-sql=true

# Formata o SQL no console para ficar mais legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Estratégia de atualização do banco (update: atualiza as tabelas se você mudar as classes)
spring.jpa.hibernate.ddl-auto=update

# ===============================
# CONFIGURAÇÕES DO SPRING
# ===============================
# Nome da aplicação
spring.application.name=case

# Log level padrão
logging.level.root=INFO
